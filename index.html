<script>

let d=T[k];if(k==='boss'){d={...d,e:S.nb%2?'🐉':'👹',hp:d.hp*(1+S.nb*.8),sz:d.sz+(S.nb%2)*20};S.nb++}const a=R()*TAU,rad=Math.max(W,H)*.6+40,hs=k==='boss'?1:1+S.t/70;

function kill(e){const B=e.k==='boss';S.kills++;S.combo++;S.comboT=2;if(B||R()<.12){S.co+=B?15:1;ems('🪙',e.x,e.y,B?6:1,160,18)}if(S.p.vamp&&S.kills%5===0){S.p.hp=Math.min(S.p.mhp,S.p.hp+2*S.p.vamp);S.tx.push({x:S.p.x,y:S.p.y-30,vy:-60,l:.7,ml:.7,t:'+'+2*S.p.vamp,c:'#7bd88f',s:20})}const CB={10:'🔥 RAMPAGE!',25:'💥 UNSTOPPABLE!',50:'🐢 TURTLE GOD!',100:'👑 LEGEND!'};if(CB[S.combo]){banner(CB[S.combo]);S.zoom=.08;snd(880,.3,'triangle',.08,2)}
burst(e.x,e.y,B?70:14,'#ffd23f',B?520:280,.7);ring(e.x,e.y,e.sz*(B?3:1.6),'#fff');ems(e.e,e.x,e.y,B?10:3,260,B?40:16);ems('✨',e.x,e.y,B?10:3,300,18);

S.shake=Math.max(S.shake,B?32:5);S.freeze=Math.max(S.freeze,B?.28:.035);snd(B?80:200+R()*80,B?.7:.12,'sawtooth',B?.13:.05,.3);

function hurt(e,a,nx,ny){const p=S.p;p.hp-=a;p.inv=.7;p.vx+=nx*-320;p.vy+=ny*-320;S.shake=18;S.flash=1;S.freeze=.08;snd(120,.25,'sawtooth',.1,.3);burst(p.x,p.y,16,'#ff4d4d',300,.5);
S.tx.push({x:p.x,y:p.y-30,vy:-80,l:.9,ml:.9,t:'-'+a,c:'#ff6b6b',s:26});
if(p.hp<=0){S.mode='over';p.hp=0;ems('🐢',p.x,p.y,8,420,36);ring(p.x,p.y,200,'#fff');S.shake=40;snd(70,1,'sawtooth',.15,.2);
SV.coins+=S.co;SV.bk+=S.kills;S.nbf=S.t>SV.best;if(S.nbf)SV.best=S.t;save();setTimeout(()=>{overScr('<h2>💀 Tirtle retired</h2><p>⏱ '+fmt(S.t)+' &nbsp; ☠️ '+S.kills+' kills &nbsp; ⭐ Lv '+p.lvl+'</p><button id=go>🔁 TRY AGAIN</button>');document.getElementById('go').onclick=start},1100)}}
function lvlUp(){const p=S.p;p.xp-=p.need;p.lvl++;p.need=5+p.lvl*4;S.mode='lvl';S.zoom=.12;S.wf=.6;ring(p.x,p.y,260,'#7bd88f');for(const e of S.en){const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy)||1;if(d<350){e.kx+=dx/d*700;e.ky+=dy/d*700}}ems('⭐',p.x,p.y,14,400,24);
[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.2,'triangle',.08,1),i*70));
const c=[...UP].sort(()=>R()-.5).slice(0,3);

function fx(dt){const s=S;for(const q of s.pt){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.g||0)*dt;q.l-=dt;if(q.vr)q.rot+=q.vr*dt}s.pt=s.pt.filter(q=>q.l>0);

s.shake*=Math.pow(.003,dt);s.wf=Math.max(0,s.wf-dt*3);for(const q of s.sp)q.l-=dt;s.sp=s.sp.filter(q=>q.l>0);s.zoom*=Math.pow(.02,dt);s.flash=Math.max(0,s.flash-dt*2.5);s.bt-=dt;s.comboT-=dt;if(s.comboT<=0)s.combo=0;s.pkT-=dt;if(s.pkT<=0)s.pk=0;

p.inv-=dt;p.sq-=p.sq*Math.min(1,dt*10);p.oa+=dt*4;
if(Math.hypot(p.vx,p.vy)>40&&R()<dt*20)S.pt.push({x:p.x,y:p.y+18,vx:rnd(-20,20),vy:-20,l:.35,ml:.35,c:'#ffffff66',r:rnd(3,6)});
p.cd-=dt;if(p.cd<=0){let n=null,nd=500;for(const e of S.en){const d=Math.hypot(e.x-p.x,e.y-p.y);if(d<nd){nd=d;n=e}}
if(n){p.cd=p.rate;const a0=Math.atan2(n.y-p.y,n.x-p.x);for(let i=0;i<p.cnt;i++){const a=a0+(i-(p.cnt-1)/2)*.2;S.eg.push({x:p.x,y:p.y,vx:Math.cos(a)*540,vy:Math.sin(a)*540,l:1.2,h:new Set(),pr:p.pierce,rot:0})}
p.sq=1;S.shake=Math.max(S.shake,2.5);p.vx-=Math.cos(a0)*70;p.vy-=Math.sin(a0)*70;snd(540+R()*120,.08,'square',.035,.4);burst(p.x+Math.cos(a0)*24,p.y+Math.sin(a0)*24,3,'#fff',100,.25)}}
for(const q of S.eg){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;q.rot+=dt*14;if(R()<.8)S.pt.push({x:q.x,y:q.y,vx:0,vy:0,l:.25,ml:.25,c:'#fff',r:4});
for(const e of S.en){if(q.h.has(e))continue;const dx=e.x-q.x,dy=e.y-q.y,lm=e.sz*.5+10;if(dx*dx+dy*dy<lm*lm){const d=Math.sqrt(dx*dx+dy*dy)||1;q.h.add(e);const cr=R()<p.cr,a=p.dmg*(cr?2.5:1)*(.9+R()*.2);hit(e,a,dx/d,dy/d,200,cr);

if(q.pr--<=0){q.l=0;break}}}}
